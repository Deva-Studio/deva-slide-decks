  <body class="presenter-page">
    <script type="application/json" id="deck-notes">{"title":"How to build a CLI for your design system","minutes":40,"slides":[{"html":"\u003cp>Welcome. \u003cb>Aimee\u003c/b>: introduce yourself, Design Engineer at Deva Studio. \u003cb>Hannah\u003c/b>: introduce yourself, Design System Architect.\u003c/p>\n    \u003cp>One line on the talk: we'll build a CLI that hands every designer a prototype on your design system, and keeps it current.\u003c/p>\n    \u003cp>The terminal on the right is the CLI we'll build, running. No need to narrate it yet.\u003c/p>","speaker":"Aimee","minutes":1},{"html":"\u003cp>How do design systems reach people today? \u003cb>Figma libraries\u003c/b> for designers, \u003cb>packages\u003c/b> for engineers, \u003cb>docs\u003c/b> for guidance.\u003c/p>\n    \u003cp>That worked when people built things by hand. Pause on the last line: AI changed who builds prototypes, and how fast.\u003c/p>","speaker":"Aimee","minutes":1.5},{"html":"\u003cp>Anyone can ask an AI agent for a working prototype in minutes. Left alone, it reaches for \u003cb>what it already knows\u003c/b>, not your system.\u003c/p>\n    \u003cp>Point at the code: a hand-rolled button with a raw colour, when the system already has \u003ccode>&lt;Button variant=\"primary\"&gt;\u003c/code>.\u003c/p>\n    \u003cp>Land it: libraries, packages and docs tell \u003cb>people\u003c/b> what to use. Nothing tells the agent.\u003c/p>","speaker":"Aimee","minutes":1.5},{"html":"\u003cp>Three things you'll learn: what a CLI is and why, how to design its setup as a decision tree, and how to keep it always current.\u003c/p>\n    \u003cp>Mention the split: \u003cb>I'll take the first two sections, Hannah the last two.\u003c/b>\u003c/p>\n    \u003cp>And everyone leaves with a forkable starter CLI.\u003c/p>","speaker":"Aimee","minutes":1},{"html":"\u003cp>Section one: what a CLI is, and why it's worth building one. Move straight on.\u003c/p>","speaker":"Aimee","minutes":0.25},{"html":"\u003cp>For anyone who hasn't used one: a CLI is a tool you use by \u003cb>typing\u003c/b>.\u003c/p>\n    \u003cp>Walk the command left to right: \u003ccode>npx\u003c/code> runs it, \u003ccode>create-ds-prototype\u003c/code> is the tool, \u003ccode>product-page\u003c/code> is your project.\u003c/p>\n    \u003cp>Then it asks a few questions, like a short form. That's the whole interface.\u003c/p>","speaker":"Aimee","minutes":1.5},{"html":"\u003cp>Why a CLI, and not a template repo or a doc? Pick two or three cards, don't read all six:\u003c/p>\n    \u003cul>\u003cli>\u003cb>Repeatable\u003c/b>: same answers, same project, every team\u003c/li>\u003cli>\u003cb>A head start for AI\u003c/b>: Claude starts from a working base, so it spends tokens on the real work\u003c/li>\u003cli>\u003cb>Easy to share\u003c/b>: one line in a ticket or chat\u003c/li>\u003c/ul>\n    \u003cp>Close on the line at the bottom: people, scripts and AI agents all run it the same way.\u003c/p>","speaker":"Aimee","minutes":1.5},{"html":"\u003cp>What it needs to work for \u003cb>everyone\u003c/b>, not just on your laptop:\u003c/p>\n    \u003cul>\u003cli>a repo host and a registry to publish it\u003c/li>\u003cli>a repo for every project, created for you\u003c/li>\u003cli>hosting for a shareable URL, and access for the people using it\u003c/li>\u003c/ul>\n    \u003cp>The point: every prototype ends up with a repo and a link to send.\u003c/p>","speaker":"Aimee","minutes":1.5},{"html":"\u003cp>Introduce the example we'll follow all the way through: one company, Brand A's \u003cb>coffee supply\u003c/b> team.\u003c/p>\n    \u003cp>The designer's task: add a \u003cb>customer reviews\u003c/b> section to the product item page.\u003c/p>\n    \u003cp>The CLI offers each brand its own templates, built from the design system. Let's look at them in Figma.\u003c/p>","speaker":"Aimee","minutes":1},{"html":"\u003cp>\u003cspan class=\"cue\">Switch to Figma\u003c/span> Keep this to two or three minutes.\u003c/p>\n    \u003cp>Show Brand A's product page template, then one other. Call out that they're built from design system components.\u003c/p>\n    \u003cp>Why a CLI: today someone rebuilds these by hand, or asks an agent and gets something close enough. We want them as a starting point.\u003c/p>\n    \u003cp>\u003cspan class=\"cue\">Switch back to the deck\u003c/span>\u003c/p>","speaker":"Aimee","minutes":2.5},{"html":"\u003cp>Section two: the setup interview, designed as a decision tree. Move straight on.\u003c/p>","speaker":"Aimee","minutes":0.25},{"html":"\u003cp>Set it up: \"We're going to plan the interview like a choose-your-own-adventure book, and we're the author.\"\u003c/p>\n    \u003cp>Press \u003cb>Enter\u003c/b> to open it. The notes for each page appear here as you go.\u003c/p>\n    \u003cp>Budget about \u003cb>5 minutes\u003c/b> for the whole story. It ends with \"Back to the slides\", which goes to Hannah's first slide.\u003c/p>","speaker":"Aimee","minutes":5.5},{"html":"\u003cp>\u003cb>Hannah takes over.\u003c/b> Section three starts here: the architecture, in the real repo.\u003c/p>\n    \u003cp>\u003cspan class=\"cue\">Switch to the code\u003c/span> Walk through, in this order:\u003c/p>\n    \u003cul>\u003cli>\u003ccode>src/\u003c/code>: entry, the decision tree, plan, generate, publish\u003c/li>\u003cli>\u003ccode>templates/\u003c/code>: one folder per brand, each a runnable project\u003c/li>\u003cli>\u003ccode>package.json\u003c/code>: the design system is a dependency\u003c/li>\u003cli>\u003ccode>agent/\u003c/code>: the \u003ccode>CLAUDE.md\u003c/code> and hooks every project gets\u003c/li>\u003c/ul>\n    \u003cp>Tie it back: each question in the story is one function in the tree.\u003c/p>","speaker":"Hannah","minutes":3.5},{"html":"\u003cp>\u003cspan class=\"cue\">Live demo\u003c/span> Run it the way a designer would:\u003c/p>\n    \u003cul>\u003cli>\u003ccode>npx create-ds-prototype product-page\u003c/code>: Prototype, Brand A, Product page\u003c/li>\u003cli>\u003ccode>npm run dev\u003c/code>: Brand A's product page, from the design system\u003c/li>\u003cli>Ask Claude for the reviews section\u003c/li>\u003cli>Share the preview URL\u003c/li>\u003c/ul>\n    \u003cp>If the install is slow, talk through what it's doing. Have a recording ready as a backup.\u003c/p>","speaker":"Hannah","minutes":3.5},{"html":"\u003cp>Section four: always current. Projects outlive the design system version they were made with.\u003c/p>","speaker":"Hannah","minutes":0.25},{"html":"\u003cp>Three things fall behind the design system:\u003c/p>\n    \u003cul>\u003cli>\u003cb>The CLI\u003c/b>: its templates and packages are a snapshot\u003c/li>\u003cli>\u003cb>What Claude knows\u003c/b>: rules written once go stale\u003c/li>\u003cli>\u003cb>Existing projects\u003c/b>: last month's prototype is on last month's release\u003c/li>\u003c/ul>\n    \u003cp>Land the line: make the latest design system the default, not something people have to remember to fetch. We'll take them one at a time.\u003c/p>","speaker":"Hannah","minutes":1.5},{"html":"\u003cp>\u003cb>The CLI\u003c/b> releases with the design system. Walk the flow: release, a bot bumps the CLI, CI scaffolds every path, publish, and the next \u003ccode>npx\u003c/code> run starts current.\u003c/p>\n    \u003cp>Callback to Aimee's section: the decision tree doubles as the test plan. Every answer is an option, so CI can run every path.\u003c/p>","speaker":"Hannah","minutes":1.5},{"html":"\u003cp>\u003cb>What Claude knows.\u003c/b> The design system team writes the guidance once and ships it \u003cb>inside the package\u003c/b>.\u003c/p>\n    \u003cp>The project's \u003ccode>CLAUDE.md\u003c/code> imports it with the \u003ccode>@\u003c/code> lines instead of copying it. When the package updates, so does what Claude reads.\u003c/p>\n    \u003cp>The guardrail reads its map from the same package.\u003c/p>","speaker":"Hannah","minutes":1.5},{"html":"\u003cp>Current context isn't enough on its own. Claude still has to \u003cb>pick the right component\u003c/b> and not invent one.\u003c/p>\n    \u003cp>Four layers: \u003cb>tell\u003c/b> it with the catalog, have it \u003cb>look up\u003c/b> before writing UI, \u003cb>block\u003c/b> what's off-system, and \u003cb>flag\u003c/b> when something's genuinely missing.\u003c/p>\n    \u003cp>Land it: rules ask, hooks enforce, and a missing component becomes a request for the design system team.\u003c/p>","speaker":"Hannah","minutes":1.5},{"html":"\u003cp>Here's the guardrail working, on our reviews task. Let the terminal play.\u003c/p>\n    \u003cp>Claude starts its own \u003ccode>ReviewCard\u003c/code>. The hook blocks it: the system already has \u003ccode>Card\u003c/code>, and the colour should be a token.\u003c/p>\n    \u003cp>Claude looks up the catalog, uses \u003ccode>Heading\u003c/code> and \u003ccode>Card\u003c/code>, and the edit passes. Point at \u003ccode>newComponents\u003c/code> in the hook code.\u003c/p>","speaker":"Hannah","minutes":1.5},{"html":"\u003cp>\u003cb>Existing projects.\u003c/b> When a Claude session starts, a hook compares what's installed with what's published.\u003c/p>\n    \u003cp>In the terminal: 4.4.0 is out with a new \u003ccode>Rating\u003c/code>. Asked to show star ratings on the reviews, Claude updates the package first, then uses \u003ccode>Rating\u003c/code>.\u003c/p>\n    \u003cp>It nudges and never blocks. Updating stays the team's call.\u003c/p>","speaker":"Hannah","minutes":1.5},{"html":"\u003cp>Putting it together: run, interview, scaffold, build, stay current.\u003c/p>\n    \u003cp>Read the closing line: the design system stops being something people look up, and becomes something they start from.\u003c/p>","speaker":"Hannah","minutes":0.75},{"html":"\u003cp>Take it home: fork the starter and add your design system. Six steps, from packages to publishing.\u003c/p>\n    \u003cp>Point at the repo link and QR code, and leave this up while you wrap up.\u003c/p>","speaker":"Hannah","minutes":1},{"html":"\u003cp>\u003cb>Both\u003c/b>: thank you. Hannah hands back to Aimee, or take questions together.\u003c/p>\n    \u003cp>Go back to the \"Fork the starter\" slide during Q&amp;A if people want the link.\u003c/p>","speaker":"Aimee and Hannah","minutes":0.5},{"html":"\u003cp>Appendix, for Q&amp;A only: an interactive version of the interview. Pick \u003cb>App\u003c/b> to show a recommendation, or switch the brand.\u003c/p>","speaker":"","minutes":0}]}</script>
